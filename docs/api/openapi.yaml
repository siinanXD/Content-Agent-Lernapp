openapi: 3.1.0
info:
  title: Content-Agent-Lernapp Pipeline API
  version: 0.1.0
  description: |
    Course generation pipeline. Mock mode until live agents land (AP-03+).
    No IHK exam copying; no PII in prompts.
servers:
  - url: /api
paths:
  /courses:
    post:
      operationId: createCourse
      summary: Create a course from a keyword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
      responses:
        '201':
          description: Course created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
  /courses/{id}/research:
    post:
      operationId: researchCourse
      summary: Fetch official sources for the occupation
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Sources stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchResult'
  /courses/{id}/plan:
    post:
      operationId: planCourse
      summary: Build day plans for learning variants
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Plans generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResult'
  /courses/{id}/generate:
    post:
      operationId: generateCourse
      summary: Generate unit content (explanation + questions)
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Content generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResult'
  /courses/{id}/evaluate:
    post:
      operationId: evaluateCourse
      summary: Judge-model quality gate
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Evaluation scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateResult'
  /courses/{id}/publish:
    post:
      operationId: publishCourse
      summary: Publish units above the quality threshold
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Publish result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResult'
  /courses/{id}/refresh:
    post:
      operationId: refreshCourse
      summary: Weekly source refresh (Hermes / manual); selective via sourceIds/moduleIds/blockIds (AP-16)
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refresh result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResult'
  /api/demo:
    post:
      summary: Demo-Zugang anfragen (SIN-277); Einwilligung ist Pflicht
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organisation, contactName, email, participants, schwerpunkt, consent]
              properties:
                organisation: { type: string, maxLength: 200 }
                contactName: { type: string, maxLength: 200 }
                email: { type: string, maxLength: 254 }
                participants: { type: integer, minimum: 1, maximum: 500 }
                schwerpunkt: { type: string, maxLength: 200 }
                consent: { type: boolean, enum: [true] }
      responses:
        '201':
          description: Gespeichert
        '400':
          description: Eingaben ungültig oder Einwilligung fehlt (fields je Feld)
        '413':
          description: Anfrage zu groß
        '503':
          description: Speichern nicht möglich
  /api/ausbilder/gruppe:
    get:
      summary: Gruppenübersicht der angemeldeten Ausbilder (SIN-277); Row Level Security, nur eigene Gruppe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Gruppe und Mitglieder (Fortschritt in Prozent, zuletzt aktiv); keine Bewertung von Personen
          content:
            application/json:
              schema:
                type: object
                required: [group, members]
                properties:
                  group:
                    type: object
                    required: [name, schwerpunkt]
                    properties:
                      name: { type: string }
                      schwerpunkt: { type: string }
                      examDate: { type: string, format: date, nullable: true }
                      startsOn: { type: string, format: date, nullable: true }
                  members:
                    type: array
                    items:
                      type: object
                      required: [id, name, progressPercent]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        progressPercent: { type: integer, minimum: 0, maximum: 100 }
                        lastActiveAt: { type: string, format: date-time, nullable: true }
        '401':
          description: Nicht angemeldet
        '403':
          description: Kein Ausbilder-Zugang
        '404':
          description: Keine Gruppe zugeordnet
        '503':
          description: Nicht eingerichtet oder nicht ladbar
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    CourseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CreateCourseRequest:
      type: object
      required: [keyword]
      properties:
        keyword:
          type: string
          example: Maschinen- und Anlagenführer
        variants:
          type: integer
          minimum: 2
          maximum: 3
          default: 2
    Course:
      type: object
      required: [id, keyword, status, createdAt, mock]
      properties:
        id: { type: string, format: uuid }
        keyword: { type: string }
        status:
          type: string
          enum: [created, researched, planned, generated, evaluated, published]
        createdAt: { type: string, format: date-time }
        mock: { type: boolean }
    Source:
      type: object
      required: [title, url, fetchedAt]
      properties:
        title: { type: string }
        url: { type: string, format: uri }
        fetchedAt: { type: string, format: date-time }
    ResearchResult:
      type: object
      required: [courseId, sources, mock]
      properties:
        courseId: { type: string }
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
        mock: { type: boolean }
    PlanResult:
      type: object
      required: [courseId, variants, mock]
      properties:
        courseId: { type: string }
        variants:
          type: array
          items:
            type: object
            required: [name, days]
            properties:
              name: { type: string }
              days:
                type: array
                items:
                  type: object
                  required: [day, units]
                  properties:
                    day: { type: integer }
                    units:
                      type: array
                      items:
                        type: object
                        required: [id, title, minutes, moduleId, blockId, sourceKind, niveau]
                        properties:
                          id: { type: string }
                          title: { type: string }
                          minutes: { type: integer }
                          moduleId: { type: string, description: Curriculum module id (e.g. M0, LF1) }
                          blockId: { type: string, description: Curriculum block id (e.g. M0-3) }
                          sourceKind:
                            type: string
                            enum: [ausbildungsordnung, rahmenlehrplan, pruefung, berufsinformation, empfehlung]
                          niveau: { type: string }
        mock: { type: boolean }
    GenerateResult:
      type: object
      required: [courseId, unitsGenerated, mock]
      properties:
        courseId: { type: string }
        unitsGenerated: { type: integer }
        moduleId: { type: string, description: Curriculum module id of generated block }
        blockId: { type: string, description: Curriculum block id of generated content }
        lernfeld:
          type: object
          properties:
            id: { type: string }
            title: { type: string }
            moduleId: { type: string }
            blockId: { type: string }
            units:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  moduleId: { type: string }
                  blockId: { type: string }
                  safetyFlag: { type: boolean }
                  niveau: { type: string }
                  variant: { type: string, enum: [standard, ablauf, rechnen, sicherheit] }
        mock: { type: boolean }
    EvaluateResult:
      type: object
      required: [courseId, passed, scores, mock]
      properties:
        courseId: { type: string }
        passed: { type: boolean }
        scores:
          type: object
          additionalProperties: { type: number }
        mock: { type: boolean }
    PublishResult:
      type: object
      required: [courseId, publishedUnits, blockedUnits, mock]
      properties:
        courseId: { type: string }
        publishedUnits: { type: integer }
        blockedUnits: { type: integer }
        mock: { type: boolean }
    RefreshRequest:
      type: object
      description: Selective refresh targets from the Quellen-Monitor (sourceIds → modules/blocks)
      properties:
        mapId: { type: string, description: Curriculum map id (e.g. maf-metall) }
        sourceIds:
          type: array
          items: { type: string }
        moduleIds:
          type: array
          items: { type: string }
        blockIds:
          type: array
          items: { type: string }
    RefreshResult:
      type: object
      required: [courseId, sourcesChanged, mock]
      properties:
        courseId: { type: string }
        mapId: { type: string, nullable: true }
        sourcesChanged: { type: boolean }
        selective: { type: boolean }
        sourceIds:
          type: array
          items: { type: string }
        moduleIds:
          type: array
          items: { type: string }
        blockIds:
          type: array
          items: { type: string }
        mock: { type: boolean }
