openapi: 3.1.0
info:
  title: Content-Agent-Lernapp Pipeline API
  version: 0.1.0
  description: |
    Course generation pipeline. Mock mode until live agents land (AP-03+).
    No IHK exam copying; no PII in prompts.
servers:
  - url: /api
paths:
  /courses:
    post:
      operationId: createCourse
      summary: Create a course from a keyword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
      responses:
        '201':
          description: Course created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
  /courses/{id}/research:
    post:
      operationId: researchCourse
      summary: Fetch official sources for the occupation
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Sources stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchResult'
  /courses/{id}/plan:
    post:
      operationId: planCourse
      summary: Build day plans for learning variants
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Plans generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResult'
  /courses/{id}/generate:
    post:
      operationId: generateCourse
      summary: Generate unit content (explanation + questions)
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Content generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResult'
  /courses/{id}/evaluate:
    post:
      operationId: evaluateCourse
      summary: Judge-model quality gate
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Evaluation scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateResult'
  /courses/{id}/publish:
    post:
      operationId: publishCourse
      summary: Publish units above the quality threshold
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Publish result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResult'
  /courses/{id}/refresh:
    post:
      operationId: refreshCourse
      summary: Weekly source refresh (Hermes / manual); selective via sourceIds/moduleIds/blockIds (AP-16)
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refresh result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResult'
  /api/demo:
    post:
      summary: Demo-Zugang anfragen (SIN-277); Einwilligung ist Pflicht
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organisation, contactName, email, participants, schwerpunkt, consent]
              properties:
                organisation: { type: string, maxLength: 200 }
                contactName: { type: string, maxLength: 200 }
                email: { type: string, maxLength: 254 }
                participants: { type: integer, minimum: 1, maximum: 500 }
                schwerpunkt: { type: string, maxLength: 200 }
                consent: { type: boolean, enum: [true] }
      responses:
        '201':
          description: Gespeichert
        '400':
          description: Eingaben ungültig oder Einwilligung fehlt (fields je Feld)
        '413':
          description: Anfrage zu groß
        '503':
          description: Speichern nicht möglich
  /api/ausbilder/gruppen:
    get:
      summary: Meine Gruppen (SIN-415); aktive und archivierte, dazu die Zugänge der Organisation
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Gruppen mit Teilnehmenden und Ø Fortschritt; `zugaenge` ist null ohne Organisation
          content:
            application/json:
              schema:
                type: object
                required: [groups, zugaenge]
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      required: [id, name, schwerpunkt, memberCount, avgPercent]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        schwerpunkt: { type: string }
                        startsOn: { type: string, format: date, nullable: true }
                        examDate: { type: string, format: date, nullable: true }
                        archivedAt: { type: string, format: date-time, nullable: true }
                        memberCount: { type: integer }
                        avgPercent: { type: integer, minimum: 0, maximum: 100 }
                  zugaenge:
                    type: object
                    nullable: true
                    required: [organisation, trainerQuota, memberQuota, used]
                    properties:
                      organisation: { type: string }
                      trainerQuota: { type: integer }
                      memberQuota: { type: integer }
                      used: { type: integer, description: Belegte Azubi-Zugänge in aktiven Gruppen }
        '401':
          description: Nicht angemeldet
        '403':
          description: Kein Ausbilder-Zugang
        '503':
          description: Nicht eingerichtet oder nicht ladbar
    post:
      summary: Gruppe archivieren oder wiederherstellen (SIN-415); nichts wird gelöscht
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, aktion]
              properties:
                id: { type: string, format: uuid }
                aktion: { type: string, enum: [archivieren, wiederherstellen] }
      responses:
        '200':
          description: Erledigt
        '400':
          description: Angaben ungültig
        '401':
          description: Nicht angemeldet
        '403':
          description: Kein Ausbilder-Zugang
        '404':
          description: Gruppe gibt es nicht oder sie ist schon im gewünschten Zustand
        '409':
          description: Beim Wiederherstellen sind nicht genug Zugänge frei
        '503':
          description: Nicht eingerichtet oder nicht speicherbar
  /api/ausbilder/zugang:
    get:
      summary: Einladungslink prüfen (SIN-415); zeigt Organisation und Kontingent, ohne Anmeldung
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string, minLength: 12, maxLength: 64 }
      responses:
        '200':
          description: Link ist offen
          content:
            application/json:
              schema:
                type: object
                required: [organisation, trainerQuota, memberQuota]
                properties:
                  organisation: { type: string }
                  trainerQuota: { type: integer }
                  memberQuota: { type: integer }
        '404':
          description: Link ungültig, abgelaufen oder schon benutzt
        '503':
          description: Nicht eingerichtet
    post:
      summary: Zugang einlösen (SIN-415); legt das Ausbilder-Konto an und sendet den Anmelde-Link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, email]
              properties:
                code: { type: string, minLength: 12, maxLength: 64 }
                email: { type: string, format: email }
      responses:
        '201':
          description: Zugang aktiv; `mailSent` sagt, ob der Anmelde-Link gesendet wurde
          content:
            application/json:
              schema:
                type: object
                required: [ok, mailSent]
                properties:
                  ok: { type: boolean }
                  mailSent: { type: boolean }
        '400':
          description: Link oder E-Mail-Adresse ungültig
        '409':
          description: Mit dieser Adresse besteht schon ein Zugang
        '410':
          description: Link ungültig, abgelaufen oder schon benutzt
        '503':
          description: Nicht eingerichtet oder nicht speicherbar
  /api/ausbilder/gruppe:
    get:
      summary: Gruppenübersicht der angemeldeten Ausbilder (SIN-277); Row Level Security, nur eigene Gruppe. Mit `?id=` eine bestimmte, auch archivierte Gruppe (SIN-415)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: false
          description: Kennung der Gruppe; ohne sie gilt die einzige aktive Gruppe
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Gruppe und Mitglieder (Fortschritt in Prozent, zuletzt aktiv); keine Bewertung von Personen
          content:
            application/json:
              schema:
                type: object
                required: [group, members]
                properties:
                  group:
                    type: object
                    required: [name, schwerpunkt]
                    properties:
                      id: { type: string, format: uuid }
                      archivedAt: { type: string, format: date-time, nullable: true }
                      name: { type: string }
                      schwerpunkt: { type: string }
                      examDate: { type: string, format: date, nullable: true }
                      startsOn: { type: string, format: date, nullable: true }
                  members:
                    type: array
                    items:
                      type: object
                      required: [id, name, progressPercent]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        progressPercent: { type: integer, minimum: 0, maximum: 100 }
                        lastActiveAt: { type: string, format: date-time, nullable: true }
        '401':
          description: Nicht angemeldet
        '403':
          description: Kein Ausbilder-Zugang
        '404':
          description: Keine Gruppe zugeordnet
        '503':
          description: Nicht eingerichtet oder nicht ladbar
    post:
      summary: Gruppe anlegen (SIN-356); mehrere je Ausbilder (SIN-415), nur ein aktiver Name je Ausbilder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, schwerpunkt]
              properties:
                name: { type: string, maxLength: 80 }
                schwerpunkt: { type: string, maxLength: 200 }
                startsOn: { type: string, format: date, nullable: true }
                examDate: { type: string, format: date, nullable: true }
      responses:
        '201':
          description: Gruppe angelegt
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        '400':
          description: Angaben fehlen oder sind ungültig
        '401':
          description: Nicht angemeldet
        '403':
          description: Kein Ausbilder-Zugang
        '409':
          description: Es gibt schon eine aktive Gruppe mit diesem Namen (beim Lesen ohne `id`: mehrere aktive Gruppen, bitte eine wählen)
        '503':
          description: Nicht eingerichtet oder nicht speicherbar
  /api/ausbilder/einladungen:
    get:
      summary: Einladungen der eigenen Gruppen (SIN-356); Row Level Security. Mit `?gruppe=` nur einer Gruppe (SIN-415)
      security:
        - bearerAuth: []
      parameters:
        - name: gruppe
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Einladungen mit Beitrittscode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitations'
        '401':
          description: Nicht angemeldet
        '403':
          description: Kein Ausbilder-Zugang
        '503':
          description: Nicht eingerichtet oder nicht ladbar
    post:
      summary: Einladungen erzeugen (SIN-356); je Name ein Platz in der Gruppe und ein Code, kein Versand
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [names]
              properties:
                groupId:
                  type: string
                  format: uuid
                  description: Aktive Gruppe (SIN-415); ohne Angabe gilt die einzige aktive Gruppe
                names:
                  type: array
                  minItems: 1
                  maxItems: 30
                  description: Vorname und Initial, höchstens 60 Zeichen, keine E-Mail-Adressen
                  items: { type: string, maxLength: 60 }
      responses:
        '201':
          description: Erzeugte Einladungen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitations'
        '400':
          description: Namen fehlen oder sind ungültig
        '401':
          description: Nicht angemeldet
        '403':
          description: Kein Ausbilder-Zugang
        '404':
          description: Noch keine Gruppe
        '409':
          description: Gruppe ist voll (höchstens 100 Teilnehmende)
        '503':
          description: Nicht eingerichtet oder nicht speicherbar
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    CourseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Invitations:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items:
            type: object
            required: [memberId, name, code]
            properties:
              memberId: { type: string, format: uuid }
              name: { type: string }
              code: { type: string, pattern: '^[A-Z0-9]{10}$' }
    CreateCourseRequest:
      type: object
      required: [keyword]
      properties:
        keyword:
          type: string
          example: Maschinen- und Anlagenführer
        variants:
          type: integer
          minimum: 2
          maximum: 3
          default: 2
    Course:
      type: object
      required: [id, keyword, status, createdAt, mock]
      properties:
        id: { type: string, format: uuid }
        keyword: { type: string }
        status:
          type: string
          enum: [created, researched, planned, generated, evaluated, published]
        createdAt: { type: string, format: date-time }
        mock: { type: boolean }
    Source:
      type: object
      required: [title, url, fetchedAt]
      properties:
        title: { type: string }
        url: { type: string, format: uri }
        fetchedAt: { type: string, format: date-time }
    ResearchResult:
      type: object
      required: [courseId, sources, mock]
      properties:
        courseId: { type: string }
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
        mock: { type: boolean }
    PlanResult:
      type: object
      required: [courseId, variants, mock]
      properties:
        courseId: { type: string }
        variants:
          type: array
          items:
            type: object
            required: [name, days]
            properties:
              name: { type: string }
              days:
                type: array
                items:
                  type: object
                  required: [day, units]
                  properties:
                    day: { type: integer }
                    units:
                      type: array
                      items:
                        type: object
                        required: [id, title, minutes, moduleId, blockId, sourceKind, niveau]
                        properties:
                          id: { type: string }
                          title: { type: string }
                          minutes: { type: integer }
                          moduleId: { type: string, description: Curriculum module id (e.g. M0, LF1) }
                          blockId: { type: string, description: Curriculum block id (e.g. M0-3) }
                          sourceKind:
                            type: string
                            enum: [ausbildungsordnung, rahmenlehrplan, pruefung, berufsinformation, empfehlung]
                          niveau: { type: string }
        mock: { type: boolean }
    GenerateResult:
      type: object
      required: [courseId, unitsGenerated, mock]
      properties:
        courseId: { type: string }
        unitsGenerated: { type: integer }
        moduleId: { type: string, description: Curriculum module id of generated block }
        blockId: { type: string, description: Curriculum block id of generated content }
        lernfeld:
          type: object
          properties:
            id: { type: string }
            title: { type: string }
            moduleId: { type: string }
            blockId: { type: string }
            units:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  moduleId: { type: string }
                  blockId: { type: string }
                  safetyFlag: { type: boolean }
                  niveau: { type: string }
                  variant: { type: string, enum: [standard, ablauf, rechnen, sicherheit] }
        mock: { type: boolean }
    EvaluateResult:
      type: object
      required: [courseId, passed, scores, mock]
      properties:
        courseId: { type: string }
        passed: { type: boolean }
        scores:
          type: object
          additionalProperties: { type: number }
        mock: { type: boolean }
    PublishResult:
      type: object
      required: [courseId, publishedUnits, blockedUnits, mock]
      properties:
        courseId: { type: string }
        publishedUnits: { type: integer }
        blockedUnits: { type: integer }
        mock: { type: boolean }
    RefreshRequest:
      type: object
      description: Selective refresh targets from the Quellen-Monitor (sourceIds → modules/blocks)
      properties:
        mapId: { type: string, description: Curriculum map id (e.g. maf-metall) }
        sourceIds:
          type: array
          items: { type: string }
        moduleIds:
          type: array
          items: { type: string }
        blockIds:
          type: array
          items: { type: string }
    RefreshResult:
      type: object
      required: [courseId, sourcesChanged, mock]
      properties:
        courseId: { type: string }
        mapId: { type: string, nullable: true }
        sourcesChanged: { type: boolean }
        selective: { type: boolean }
        sourceIds:
          type: array
          items: { type: string }
        moduleIds:
          type: array
          items: { type: string }
        blockIds:
          type: array
          items: { type: string }
        mock: { type: boolean }
