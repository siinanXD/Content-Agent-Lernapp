# Wächter gegen rotes main (SIN-252): Wird die CI auf `main` nach einem Merge rot, öffnet dieser Lauf
# automatisch einen Revert-PR. Der PR läuft normal durch pr-gate (`risk:medium`, Auto-Merge bei grünen Checks).
# Das ist das Sicherheitsnetz dafür, dass weniger PRs von Hand freigegeben werden.
#
# Regeln (SIN-502, scripts/autonomy/revert-guard.mjs): Revert nur, wenn der rote Schritt auf dem Eltern-Commit grün
# war (sonst Gate-Bruch-Issue); höchstens 1 Revert je Stunde, danach Meldung an Sinan (Label `sinan`); ein roter
# Revert-Commit stoppt die Kette ebenfalls mit Meldung.
# Außerdem: nur ein Revert-PR je Commit; kein Revert eines Reverts (sonst Endlosschleife); Merge-Commits und
# Commits ohne Squash-Form werden nicht angefasst, dort meldet der Lauf nur. Der Hinweis im PR-Text taucht im
# Tages-Update (SIN-246) auf, weil der PR-Titel mit `revert:` beginnt.
# Live-Check (SIN-319): Wird `nach-deploy` nach einem Production-Deploy rot (Auslöser deployment_status, nicht der
# nächtliche Lauf), nimmt dieser Lauf den Commit des Deploys zurück, solange er noch die Spitze von main ist. Der
# Revert-Commit löst über den Status-Wächter den nächsten Deploy aus (letzter grüner Stand). Hilft das nicht, wird
# `nach-deploy` erneut rot; der Revert eines Reverts ist gesperrt, dann bleibt die Meldung im Status und Tages-Update.
# SIN-492: Der Job `linear` setzt nach dem Merge eines Revert-PRs das Linear-Issue des Originals wieder auf Todo
# (zweite Rücknahme: needs-human). Skript: scripts/autonomy/revert-linear.mjs.
# Token: AGENT_WORKFLOW_TOKEN (nie github.token, sonst starten keine Folge-Workflows).
name: revert-guard

on:
  workflow_run:
    workflows: [ci, nach-deploy]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: revert-guard
  cancel-in-progress: false

jobs:
  revert:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      ((github.event.workflow_run.name == 'ci' && github.event.workflow_run.event == 'push') ||
       (github.event.workflow_run.name == 'nach-deploy' && github.event.workflow_run.event == 'deployment_status'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_NAME: ${{ github.event.workflow_run.name }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      REASON: ${{ github.event.workflow_run.name == 'nach-deploy' && 'der Live-Check nach dem Production-Deploy rot war' || 'die CI auf main rot wurde' }}
    steps:
      - name: Revert-PR öffnen
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "::warning::AGENT_WORKFLOW_TOKEN fehlt, kein Revert-PR."; exit 0; fi
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"

          # Nur reparieren, wenn der rote Commit noch die Spitze von main ist.
          if [ "$(git rev-parse origin/main)" != "$SHA" ]; then
            echo "main ist weiter als $SHA, ein neuerer Lauf entscheidet."; exit 0
          fi
          title=$(git log -1 --format=%s "$SHA")
          parents=$(git log -1 --format=%p "$SHA" | wc -w)
          if [ "$parents" -ne 1 ]; then echo "Merge-Commit, kein automatischer Revert."; exit 0; fi

          # SIN-502: Revert nur, wenn derselbe Schritt auf dem Eltern-Commit grün war; höchstens 1 Revert je Stunde.
          # Sonst Gate-Bruch-Issue bzw. Meldung an Sinan (Logik: scripts/autonomy/revert-guard.mjs).
          decision=$(node scripts/autonomy/revert-guard.mjs --sha "$SHA" --run "$RUN_ID" --name "$RUN_NAME" --title "$title" | tail -1)
          echo "$decision"
          if [ "$(printf '%s' "$decision" | jq -r .aktion)" != "revert" ]; then
            echo "Kein Revert: $(printf '%s' "$decision" | jq -r .grund)"; exit 0
          fi

          branch="claude/revert-${SHA:0:7}"
          if [ -n "$(gh pr list --head "$branch" --state all --json number --jq '.[0].number')" ]; then
            echo "Revert-PR für $SHA existiert schon."; exit 0
          fi

          git checkout -b "$branch" origin/main
          git revert --no-edit "$SHA"
          issue=$(printf '%s' "$title" | grep -oE 'SIN-[0-9]+' | tail -1 || true)
          msg_title="revert: ${title%% (#*} zurücknehmen${issue:+ ($issue)}"
          # Mehrzeilige Texte per printf, nicht als freie Zeilen im run-Block (sonst bricht das YAML, SIN-252).
          git commit --amend -q -F <(printf '%s\n\nPart of %s\nRevert von %s, weil %s.\n\nCo-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>\n' \
            "$msg_title" "${issue:-SIN-252}" "$SHA" "$REASON")
          git push -q origin "$branch"

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${{ github.event.workflow_run.id }}"
          body=$(printf 'Part of %s\n\n## Was ändert sich\nNimmt `%s` (%s) zurück, weil %s. Der Stand von vorher ist wieder da.\n\n## Nach dem Merge\nAuto-Merge bei grünen Checks (`risk:medium`). Danach das ursprüngliche Issue prüfen und die Änderung in einem neuen PR korrigiert wieder einbringen.\n\nFehlgeschlagener Lauf: %s\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)\n' \
            "${issue:-SIN-252}" "${SHA:0:7}" "$title" "$REASON" "$run_url")
          gh pr create --base main --head "$branch" \
            --title "$msg_title" --body "$body"

  # SIN-492: Ist der CI-Lauf auf main der Merge eines Revert-PRs von revert-guard, steht das Linear-Issue des
  # Originals danach wieder auf Todo (zweite Rücknahme: Label needs-human). Läuft nach jedem CI-Lauf auf main,
  # nicht nur nach roten: der Revert-Commit selbst kann grün oder rot sein. Ohne Revert-PR tut der Lauf nichts.
  linear:
    if: github.event.workflow_run.name == 'ci'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Zurückgenommenes Issue wieder öffnen
        env:
          GH_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/autonomy/revert-linear.mjs --sha "$SHA"
