# PR-Gate (SIN-207, ausgerollt mit SIN-208): prüft den PR-Titel, setzt das
# Risiko-Label automatisch und schaltet Auto-Merge ein.
#
#   risk:low (Standard)    → Auto-Merge (Squash), sobald alle Pflicht-Checks grün sind, ohne Frist (SIN-811)
#   risk:medium            → Auto-Merge nach 30 Min Einspruchsfrist (SIN-547, SIN-811)
#   risk:high              → Job `merge-gate` endet rot („wartet auf Freigabe von Sinan“) und sperrt den
#                            Merge, bis Sinan das Label `freigegeben` setzt; der neue Lauf ersetzt das
#                            Ergebnis (SIN-261, löst das Check-Run-Verfahren aus SIN-247 ab).
#
# Die Regeln stehen in scripts/autonomy/risk.mjs (SIN-223), geladen aus der Basis des PRs.
# Die Freigabe überlebt Folge-Commits, solange kein neuer High-Grund dazukommt. Das Gate
# merkt sich die Gründe der Freigabe (Schlüssel) im eigenen Kommentar und prüft bei jedem
# Lauf den aktuellen Stand des PRs, nicht das auslösende Ereignis.
# Nur der Repo-Owner kann freigeben; ein Label von einem Bot oder Agenten zählt nicht.
#
# Läuft auf `pull_request` (nicht `pull_request_target`) und checkt nur die Basis aus,
# nie PR-Code. Gitleaks scannt die hinzugefügten Zeilen aus der API (Patch), nicht den Checkout. PRs aus Forks bekommen nur ein Lese-Token und sind immer risk:high.
# Diese Datei ist in allen Repos gleich. Änderungen zuerst in der Vorlage (SIN-202).
name: pr-gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]
  # SIN-240: Ist `ci` fertig, wird das Gate neu bewertet (Job `regate`). Ein eigener Lauf dieser Datei hinge nicht
  # am Head-Commit des PRs, darum startet `regate` den letzten pr-gate-Lauf des Commits neu.
  workflow_run:
    workflows: [ci]
    types: [completed]
  # SIN-547: Einspruchsfrist abgelaufen? Dann den letzten pr-gate-Lauf neu starten (Job `einspruch-ende`).
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

# Kein cancel-in-progress: Ein abgebrochener Lauf darf keine Entscheidung verschlucken.
concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  # Gate neu bewerten, wenn CI fertig ist: Freigabe (`freigegeben`) gilt, egal ob vor oder nach Grün gesetzt,
  # und ein vergessenes Auto-Merge wird nachgeholt. Das Neustarten hängt am selben Commit, nicht an einem Label-Ereignis.
  regate:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Letzten pr-gate-Lauf des Commits neu starten
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AGENT_WORKFLOW_TOKEN || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            let number = run.pull_requests?.[0]?.number;
            if (!number) {
              const { data } = await github.rest.pulls.list({ owner, repo, state: "open", head: `${owner}:${run.head_branch}` });
              number = data[0]?.number;
            }
            if (!number) { core.info("Kein offener PR."); return; }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== "open" || pr.draft || pr.head.sha !== run.head_sha) {
              core.info("PR geschlossen, Draft oder schon neuer Commit: nichts zu tun.");
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: "pr-gate.yml", event: "pull_request", head_sha: run.head_sha, per_page: 20,
            });
            const latest = data.workflow_runs.sort((a, b) => b.run_number - a.run_number || b.run_attempt - a.run_attempt)[0];
            if (!latest) { core.info("Kein pr-gate-Lauf zu diesem Commit."); return; }
            if (latest.status !== "completed") { core.info("pr-gate läuft noch und bewertet frisch."); return; }
            await github.rest.actions.reRunWorkflow({ owner, repo, run_id: latest.id });
            core.info(`pr-gate-Lauf ${latest.id} neu gestartet (PR #${number}).`);

  # SIN-547: Läuft die Einspruchsfrist ab, startet dieser Job den letzten pr-gate-Lauf des PRs neu; das Gate
  # bewertet dann frisch (Zeitstempel im Kommentar `pr-gate-einspruch`) und schaltet Auto-Merge ein.
  einspruch-ende:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Abgelaufene Fristen neu bewerten
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AGENT_WORKFLOW_TOKEN || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });
            // SIN-843: alte PRs tragen noch `einspruch:2h`; ihre Frist (bis im Kommentar) läuft weiter ab und wird nicht neu gestartet.
            const FRIST_LABELS = ["einspruch:30m", "einspruch:2h"];
            // Aufbauphase: Label und `bis` sperren nicht; jeder PR mit Frist-Label wird sofort neu bewertet (das Gate entfernt das Label).
            const { AUFBAUPHASE } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/autonomy/risk.mjs`);
            for (const pr of prs.filter((p) => !p.draft && p.labels.some((l) => FRIST_LABELS.includes(l.name)))) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
              const m = comments.map((c) => c.body?.match(/<!-- pr-gate-einspruch sha=(\w+) bis=(\d+)(?: gruende=\w+)? -->/)).filter(Boolean).pop();
              if (!AUFBAUPHASE && (!m || m[1] !== pr.head.sha || Date.now() < Number(m[2]))) continue;
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: "pr-gate.yml", event: "pull_request", head_sha: pr.head.sha, per_page: 20,
              });
              const latest = data.workflow_runs.sort((a, b) => b.run_number - a.run_number || b.run_attempt - a.run_attempt)[0];
              if (latest?.status !== "completed") continue;
              await github.rest.actions.reRunWorkflow({ owner, repo, run_id: latest.id });
              core.info(`Frist von PR #${pr.number} abgelaufen: pr-gate-Lauf ${latest.id} neu gestartet.`);
            }

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: PR-Titel prüfen
        env:
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot-PR: Titelprüfung übersprungen."
            exit 0
          fi
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR-Titel ist kein Conventional Commit. Beispiel: feat(api): Export als CSV (SIN-123)"
            exit 1
          fi
          if ! printf '%s' "$TITLE" | grep -Eq 'SIN-[0-9]+'; then
            echo "::error::PR-Titel braucht die Linear-ID, z. B. (SIN-123)."
            exit 1
          fi
          echo "PR-Titel ok."

  # Der Job `gate` entscheidet; der Job `merge-gate` (unten) meldet das Ergebnis an das Ruleset (SIN-261).
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      waiting: ${{ steps.decide.outputs.waiting }}
      einspruch_bis: ${{ steps.decide.outputs.einspruch_bis }}
    steps:
      # Basis, nie PR-Code: Regeln (risk.mjs) kommen aus dem Ziel-Branch.
      - uses: actions/checkout@v4
        with:
          # SIN-843: aktueller Kopf der Basis, nicht der Stand bei PR-Start; ein Neustart alter Läufe lädt sonst alte Regeln (Frist).
          ref: ${{ github.event.pull_request.base.ref }}

      # Leitstand (SIN-303): Start/Ende als Ereignis in Supabase. Skript aus der Basis (nie PR-Code); fehlt es dort
      # noch, entfällt der Schritt. Nie ein Fehlerabbruch.
      - name: Leitstand Start
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "LEITSTAND_SEIT=$(date +%s%3N)" >> "$GITHUB_ENV"
          if [ -f scripts/autonomy/leitstand.mjs ]; then
            node scripts/autonomy/leitstand.mjs ereignis --schritt pr-gate --status start --pr "$PR_NUMBER"
          fi

      - name: Geänderte Zeilen des PRs laden
        id: diff
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const { owner, repo } = context.repo;
            // SIN-511: Diff Basis…Kopf (drei Punkte, ab Merge-Basis). Was ein Merge aus main hereinbringt,
            // steht dort nicht und löst keinen neuen High-Grund aus.
            const { data: prNow } = await github.rest.pulls.get({
              owner, repo, pull_number: context.payload.pull_request.number,
            });
            const files = await github.paginate(github.rest.repos.compareCommitsWithBasehead, {
              owner, repo, basehead: `${prNow.base.sha}...${prNow.head.sha}`, per_page: 100,
            }, (res) => res.data.files);
            const dir = path.join(process.env.RUNNER_TEMP, "pr-diff");
            fs.mkdirSync(dir, { recursive: true });
            files.forEach((f, i) => {
              const added = (f.patch ?? "").split("\n")
                .filter((l) => l.startsWith("+") && !l.startsWith("+++")).map((l) => l.slice(1)).join("\n");
              // Dateiname im Namen, damit gitleaks Pfad-Regeln (z. B. .env) greifen; Index gegen Kollisionen.
              fs.writeFileSync(path.join(dir, `${i}__${path.basename(f.filename)}`), added);
            });
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "pr-files.json"), JSON.stringify(files));
            core.setOutput("dir", dir);

      - name: gitleaks auf hinzugefügte Zeilen
        id: leaks
        env:
          GITLEAKS_VERSION: "8.28.0"
          DIFF_DIR: ${{ steps.diff.outputs.dir }}
        run: |
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          if "$RUNNER_TEMP/gitleaks" detect --no-git --source "$DIFF_DIR" --redact --no-banner --exit-code 1; then
            echo "leak=false" >> "$GITHUB_OUTPUT"
          else
            echo "leak=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Risiko bestimmen, Label setzen, Auto-Merge steuern
        id: decide
        uses: actions/github-script@v7
        env:
          SECRET_LEAK: ${{ steps.leaks.outputs.leak }}
          AGENT_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require("node:fs");
            const riskModule = await import(`${process.env.GITHUB_WORKSPACE}/scripts/autonomy/risk.mjs`);
            const { classifyRisk, approvalStillValid } = riskModule;
            const newReasons = typeof riskModule.newReasons === "function" ? riskModule.newReasons : () => [];
            // risk.mjs kommt aus der Basis (main). Neue Exporte sind optional: Die neuen Regeln greifen erst
            // nach dem Merge, vorher fällt das Gate auf den alten Stand zurück statt zu crashen.
            const newDependencies = typeof riskModule.newDependencies === "function" ? riskModule.newDependencies : () => [];
            const fetchDependencyInfo = typeof riskModule.fetchDependencyInfo === "function"
              ? riskModule.fetchDependencyInfo : async () => ({});
            // SIN-516: Secret-Namen, die auf main (Checkout = Basis) in irgendeinem Workflow vorkommen. Nur Namen.
            const knownSecrets = typeof riskModule.secretNames === "function"
              ? riskModule.secretNames(fs.readdirSync(".github/workflows")
                .filter((n) => /\.ya?ml$/.test(n))
                .map((n) => fs.readFileSync(`.github/workflows/${n}`, "utf8")))
              : [];
            // SIN-547: Fristregeln aus der Basis; fehlen sie dort noch, gibt es keine Frist (alter Stand).
            const einspruchFrist = typeof riskModule.einspruchFrist === "function" ? riskModule.einspruchFrist : null;
            // SIN-855: Aufbauphase ohne Frist, Regel aus der Basis (main); fehlt `fristGilt` dort, gilt der alte Stand mit Frist.
            const fristGilt = typeof riskModule.fristGilt === "function"
              ? riskModule.fristGilt : (r, e) => r === "risk:medium" && e.length > 0;
            const trustedOwners = (JSON.parse(fs.readFileSync("docs/autonomy/config.json", "utf8")).ERLAUBTE_ACTION_OWNER) ?? [];
            const { owner, repo } = context.repo;
            const action = context.payload.action;
            const sender = context.payload.sender?.login;
            const eventSha = context.payload.pull_request.head.sha;
            const MARKER = "<!-- pr-gate -->";
            const KEYS_RE = /<!-- pr-gate approved-keys: (\[.*?\]) -->/;
            const BOT = "github-actions[bot]";
            // Labels und Auto-Merge mit dem Agenten-Token (SIN-240): Ereignisse von github.token lösen keine Folge-
            // Workflows aus. Der Hinweis-Kommentar bleibt beim Standard-Token, denn der Marker wird am Autor
            // (BOT) erkannt. Ohne Secret (Fork- und Dependabot-PRs, dort mergt nie jemand automatisch): github.token.
            const agent = process.env.AGENT_TOKEN ? new github.constructor({ auth: process.env.AGENT_TOKEN }) : github;
            // Wer freigeben darf. Labels von Bots/Agenten (z. B. claude[bot]) zählen nicht.
            const APPROVERS = [owner];
            // Freigabe-Labels: `freigegeben` ist der Standard, `owner-approved` bleibt aus dem
            // älteren Merge-Gate (document-intelligence-mvp) gültig.
            const APPROVALS = ["freigegeben", "owner-approved"];
            const NO_AUTOMERGE = "no-automerge";
            const RISK_LABELS = {
              "risk:low": { color: "0E8A16", description: "Automatisch: Standard, Auto-Merge ohne Frist" },
              "risk:medium": { color: "FBCA04", description: "Automatisch: Auto-Merge nach 30 Min Einspruchsfrist" },
              "risk:high": { color: "B60205", description: "Automatisch: braucht Freigabe von Sinan" },
            };

            // Immer den aktuellen Stand des PRs lesen, nicht den Payload des Ereignisses.
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: context.payload.pull_request.number,
            });
            if (pr.state !== "open") {
              core.info("PR ist nicht mehr offen.");
              return;
            }
            if (pr.head.sha !== eventSha) {
              // Ein neuerer Commit ist da; sein eigener Lauf entscheidet. Dieser Lauf zählt nicht.
              core.setFailed(`Veralteter Lauf (${eventSha.slice(0, 7)}), aktueller Commit ist ${pr.head.sha.slice(0, 7)}.`);
              return;
            }

            const files = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/pr-files.json`, "utf8"));
            let labels = pr.labels.map((l) => l.name);
            const isFork = pr.head.repo?.full_name !== `${owner}/${repo}`;
            const gateFiles = files.map((f) => ({
              filename: f.filename, previous_filename: f.previous_filename, status: f.status, patch: f.patch,
            }));
            // SIN-252: neue npm-Abhängigkeiten nur mit MIT/Apache und > 500 Sternen (npm-Registry, GitHub-API).
            const depInfo = await fetchDependencyInfo(newDependencies(gateFiles), fetch, process.env.GITHUB_TOKEN);
            const { risk, reasons, einspruch = [] } = classifyRisk({
              files: gateFiles,
              depInfo,
              knownSecrets,
              trustedOwners,
              labels,
              isFork,
              secretLeak: process.env.SECRET_LEAK === "true",
            });

            core.summary.addHeading(`Risiko: ${risk}`, 3)
              .addRaw(`${files.length} Dateien geändert.`).addEOL();
            if (reasons.length) core.summary.addList(reasons.slice(0, 15).map((r) => r.text));
            if (einspruch.length) core.summary.addHeading("Einspruchsfrist", 4).addList(einspruch.slice(0, 15).map((r) => r.text));
            await core.summary.write();

            if (isFork) {
              core.setFailed("PR aus einem Fork: wird nie automatisch gemerged.");
            }

            // Labels anlegen (falls neu) und genau ein Risiko-Label setzen.
            for (const [name, meta] of Object.entries({ ...RISK_LABELS,
              freigegeben: { color: "1D76DB", description: "Sinan hat einen risk:high-PR freigegeben" },
              "einspruch:30m": { color: "FEF2C0", description: "Automatisch: Auto-Merge nach 30 Min Einspruchsfrist, Stopp mit no-automerge" } })) {
              try { await agent.rest.issues.createLabel({ owner, repo, name, ...meta }); }
              catch (e) { if (e.status !== 422) core.warning(`Label ${name} nicht angelegt (SIN-335): ${e.message}`); }
            }
            for (const l of labels.filter((l) => l.startsWith("risk:") && l !== risk)) {
              try { await agent.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: l }); }
              catch (e) { if (e.status !== 404) throw e; }
            }
            if (!labels.includes(risk)) {
              await agent.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [risk] });
            }
            if (isFork) return;

            const removeApprovals = async () => {
              for (const l of APPROVALS.filter((l) => labels.includes(l))) {
                try { await agent.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: l }); }
                catch (e) { if (e.status !== 404) throw e; }
              }
              labels = labels.filter((l) => !APPROVALS.includes(l));
            };

            // Freigabe an die High-Gründe binden: gemerkte Schlüssel stehen im Kommentar des Gates.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const mine = comments.find((c) => c.user?.login === BOT && c.body?.includes(MARKER));
            let approvedKeys = null;
            try { approvedKeys = mine?.body?.match(KEYS_RE) ? JSON.parse(mine.body.match(KEYS_RE)[1]) : null; }
            catch { approvedKeys = null; }
            let note = "";

            const labelEvent = action === "labeled" && APPROVALS.includes(context.payload.label?.name);
            if (labelEvent) {
              if (APPROVERS.includes(sender)) {
                approvedKeys = reasons.map((r) => r.key);
              } else {
                note = `Freigabe-Label von \`${sender}\` zählt nicht. Nur ${APPROVERS.join(", ")} darf freigeben.`;
                core.warning(note);
                if (!approvalStillValid(approvedKeys, reasons)) await removeApprovals();
              }
            }
            if (!APPROVALS.some((l) => labels.includes(l))) approvedKeys = null;

            let approved = false;
            if (risk === "risk:high") {
              const hasLabel = APPROVALS.some((l) => labels.includes(l));
              approved = hasLabel && approvalStillValid(approvedKeys, reasons);
              if (hasLabel && !approved) {
                const fresh = newReasons(approvedKeys, reasons);
                await removeApprovals();
                approvedKeys = null;
                // SIN-511: konkreter Grund (Datei + Regel), damit Sinan sieht, warum die Freigabe wegfiel.
                const why = fresh.length ? fresh.slice(0, 5).map((r) => `\`${r.text}\``).join("; ") : "keine Angabe";
                note = note || `Neuer High-Grund seit der Freigabe: ${why}. Bitte \`freigegeben\` neu setzen.`;
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number,
                  body: `Freigabe entzogen, weil seit dem Label ein neuer High-Grund dazukam: ${why}.` });
              }
            }
            // SIN-547: Einspruchsfrist nur bei risk:medium mit Frist-Gründen; Zeitstempel im eigenen Kommentar, neu nur bei geänderten Gründen.
            const FRIST = "einspruch:30m";
            const fristMine = comments.find((c) => c.user?.login === BOT && c.body?.includes("<!-- pr-gate-einspruch "));
            let fristOffen = false;
            if (einspruchFrist && fristGilt(risk, einspruch)) {
              const fr = einspruchFrist(fristMine?.body, pr.head.sha, Date.now(), einspruch.map((r) => r.key));
              if (!fristMine) await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: `${fr.comment}\nEinspruchsfrist bis ${new Date(fr.bis).toISOString()}. Stopp mit dem Label \`no-automerge\`.` });
              else if (fr.neu) await github.rest.issues.updateComment({ owner, repo, comment_id: fristMine.id, body: `${fr.comment}\nEinspruchsfrist bis ${new Date(fr.bis).toISOString()}. Stopp mit dem Label \`no-automerge\`.` });
              fristOffen = !fr.vorbei;
              if (!labels.includes(FRIST)) await agent.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [FRIST] });
              if (fristOffen) {
                core.setOutput("einspruch_bis", new Date(fr.bis).toISOString());
                note = note || `Einspruchsfrist bis ${new Date(fr.bis).toISOString()} (${einspruch.slice(0, 3).map((r) => r.text).join("; ")}). Stopp mit \`no-automerge\`.`;
              }
            } else if (labels.includes(FRIST)) {
              try { await agent.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: FRIST }); }
              catch (e) { if (e.status !== 404) throw e; }
            }
            // SIN-843: altes Label `einspruch:2h` entfernen (gilt die Frist, ersetzt durch `einspruch:30m`, `bis` bleibt).
            if (labels.includes("einspruch:2h")) {
              try { await agent.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: "einspruch:2h" }); }
              catch (e) { if (e.status !== 404) throw e; }
            }
            const allowAutoMerge = !pr.draft && !labels.includes(NO_AUTOMERGE) && !fristOffen
              && (risk !== "risk:high" || approved);

            // Steckbrief (SIN-248): ein Kommentar für jeden PR, wird aktualisiert statt neu gepostet.
            // Die Erwähnung steht nur bei 🟠/🔴 im Text und verschwindet beim Aktualisieren, wenn nichts mehr zu tun ist.
            const stateOf = (run) => !run ? "none" : run.status !== "completed" ? "run"
              : ["success", "skipped", "neutral"].includes(run.conclusion) ? "ok" : "fail";
            const checks = { build: "none", tests: "none", a11y: "none", prTitle: "none" };
            let previewUrl = null;
            try {
              const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, head_sha: pr.head.sha, per_page: 30,
              });
              const latestOf = (name) => runs.workflow_runs.filter((r) => r.name === name).sort((a, b) => b.run_number - a.run_number)[0];
              const jobsOf = async (run) => run
                ? (await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id: run.id })).data.jobs : [];
              const build = (await jobsOf(latestOf("ci"))).find((j) => j.name === "build");
              checks.build = stateOf(build);
              const step = (re) => stateOf(build?.steps?.find((s) => re.test(s.name)));
              checks.tests = step(/^Unit tests/);
              checks.a11y = step(/accessibility/i);
              checks.prTitle = stateOf((await jobsOf(latestOf("pr-gate"))).find((j) => j.name === "pr-title"));
              const { data: deployments } = await github.rest.repos.listDeployments({ owner, repo, sha: pr.head.sha, per_page: 10 });
              for (const d of deployments) {
                const { data: sts } = await github.rest.repos.listDeploymentStatuses({ owner, repo, deployment_id: d.id, per_page: 1 });
                if (sts[0]?.state === "success" && sts[0].environment_url) { previewUrl = sts[0].environment_url; break; }
              }
            } catch (e) {
              core.warning(`Checks/Vorschau nicht lesbar: ${e.message}`);
            }
            // Aus der Basis geladen: im PR, der das Modul einführt, fehlt es dort noch (dann kein Kommentar).
            const steck = await import(`${process.env.GITHUB_WORKSPACE}/scripts/autonomy/steckbrief.mjs`)
              .catch((e) => { core.warning(`steckbrief.mjs fehlt in der Basis: ${e.message}`); return null; });
            const brief = steck?.buildSteckbrief({
              title: pr.title, branch: pr.head.ref, body: pr.body ?? "", labels,
              files: files.map((f) => ({ filename: f.filename, status: f.status })),
              risk, reasons, approved, approvedKeys, checks, previewUrl, owner, note,
            });
            // Ohne Modul in der Basis: einfacher Kommentar, damit die Freigabe-Schlüssel erhalten bleiben.
            const commentBody = brief?.body ?? [
              MARKER,
              ...(approved ? [`<!-- pr-gate approved-keys: ${JSON.stringify(approvedKeys)} -->`] : []),
              `**${risk}${approved ? " – freigegeben" : risk === "risk:high" ? " – wartet auf Freigabe" : ""}.**`,
              "",
              ...reasons.slice(0, 15).map((r) => `- ${r.text}`),
            ].join("\n");
            if (!mine) await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: commentBody });
            else if (mine.body !== commentBody) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: commentBody });

            // Auto-Merge an- oder ausschalten (GraphQL, Squash) mit dem Agenten-Token (SIN-237): Merges mit
            // github.token lösen keine Workflows aus (linear-done, post-merge).
            const mergeGh = agent;
            const autoOn = Boolean(pr.auto_merge);
            try {
              if (allowAutoMerge && !autoOn) {
                await mergeGh.graphql(
                  `mutation($id: ID!) { enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) { clientMutationId } }`,
                  { id: pr.node_id },
                );
                core.info("Auto-Merge eingeschaltet.");
              } else if (!allowAutoMerge && autoOn) {
                await mergeGh.graphql(
                  `mutation($id: ID!) { disablePullRequestAutoMerge(input: { pullRequestId: $id }) { clientMutationId } }`,
                  { id: pr.node_id },
                );
                core.info("Auto-Merge ausgeschaltet.");
              }
            } catch (e) {
              core.warning(`Auto-Merge nicht geändert: ${e.message}. Ist „Allow auto-merge“ in den Repo-Einstellungen an und gibt es Pflicht-Checks?`);
            }

            if (risk === "risk:high" && !approved) {
              core.setOutput("waiting", "true");
              core.notice("risk:high: wartet auf das Label `freigegeben` von Sinan.");
            }

      - name: Leitstand Ende
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          status=$([ "$JOB_STATUS" = "success" ] && echo ok || echo fehler)
          if [ -f scripts/autonomy/leitstand.mjs ]; then
            node scripts/autonomy/leitstand.mjs ereignis --schritt pr-gate --status "$status" --seit "$LEITSTAND_SEIT" --pr "$PR_NUMBER"
          fi

  # SIN-261: Pflicht-Check `merge-gate` (Name aus dem Ruleset) ist wieder ein echter Job. Ein per Checks-API
  # geschriebener Check-Run wurde vom Ruleset nicht erkannt („Waiting for status to be reported“), kein PR mergte.
  # Nicht freigegeben (risk:high) = Job endet rot mit klarer Meldung; das Label `freigegeben` startet pr-gate neu
  # und der neue Lauf ersetzt das Ergebnis. Der Merge bleibt so gesperrt, bis die Freigabe da ist.
  merge-gate:
    needs: gate
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GATE_RESULT: ${{ needs.gate.result }}
      WAITING: ${{ needs.gate.outputs.waiting }}
      EINSPRUCH_BIS: ${{ needs.gate.outputs.einspruch_bis }}
    steps:
      # SIN-1001: Prüfer-Beleg für den aktuellen Head bei claude/- und codex/-PRs. Logik aus der Basis (nie PR-Code);
      # fehlt sie dort noch (der PR, der sie einführt), entfällt die Prüfung.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - name: Prüfer-Beleg prüfen
        id: beleg
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const mod = await import(`${process.env.GITHUB_WORKSPACE}/scripts/autonomy/beleg-gate.mjs`).catch(() => null);
            if (!mod) { core.info("beleg-gate.mjs fehlt in der Basis: keine Prüfung."); return; }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: context.payload.pull_request.number });
            const comments = (await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 }))
              .map((c) => ({ user: c.user?.login, owner: c.author_association === "OWNER", body: c.body }));
            const r = mod.belegGate({ branch: pr.head.ref, headSha: pr.head.sha, comments });
            core.info(r.grund);
            if (r.noetig && !r.ok) core.setOutput("fehlt", r.grund);
      - name: Ergebnis des Gates melden
        env:
          BELEG_FEHLT: ${{ steps.beleg.outputs.fehlt }}
        run: |
          if [ -n "$BELEG_FEHLT" ]; then
            echo "::error::$BELEG_FEHLT Der Leitstand-Prüfer muss den aktuellen Head belegen (SIN-1001); der Merge ist bis dahin gesperrt."
            exit 1
          fi
          if [ "$GATE_RESULT" != "success" ]; then
            echo "::error::Gate-Ergebnis ${GATE_RESULT:-leer}. Gate-Fehler (Fork, Secret-Leak, veralteter Lauf oder Skript-Fehler). Details im Job gate."
            exit 1
          fi
          if [ "$WAITING" = "true" ]; then
            echo "::error::risk:high: wartet auf das Label freigegeben von Sinan. Kein Fehler, der Merge ist gesperrt."
            exit 1
          fi
          if [ -n "$EINSPRUCH_BIS" ]; then
            echo "::error::Einspruchsfrist läuft bis $EINSPRUCH_BIS (SIN-547). Danach merged der PR von selbst; Stopp mit dem Label no-automerge."
            exit 1
          fi
          echo "Gate ok."
