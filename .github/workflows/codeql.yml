# CodeQL (SIN-295): Codeanalyse bei jedem PR, bei Push auf main und wöchentlich.
# Nur Leserechte: Ergebnisse gehen nicht an den Security-Tab (dafür wäre `security-events: write` nötig),
# sondern werden hier ausgewertet. Funde mit hoher Schwere (CVSS >= 7.0) lassen den Lauf scheitern.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
          upload: never
          output: codeql-results

      - name: Funde hoher Schwere prüfen
        run: node scripts/autonomy/codeql-gate.mjs codeql-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
          retention-days: 14
