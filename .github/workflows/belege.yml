name: belege

on:
  schedule:
    - cron: "23 */2 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur anzeigen, nichts in Linear ändern"
        type: boolean
        default: true

concurrency:
  group: belege
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  belege:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Belege prüfen (nur lesende Datenbankrolle)
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          SUPABASE_PRUEFER_URL: ${{ secrets.SUPABASE_PRUEFER_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: node --import tsx scripts/belege/belege.ts
