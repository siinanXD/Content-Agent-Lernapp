# Marketing-Agent (SIN-484): 3 Werbetexte (LinkedIn, Website, E-Mail an Bildungsträger) für einen veröffentlichten Kurs.
# Zahlen nur aus der Datenbank, Prüfung nach dem Schreiben (scripts/autonomy/marketing.mjs), Ablage in `werbemittel`
# mit Status `wartet_auf_freigabe`. Veröffentlicht wird hier nie. Deckel 1 € pro Lauf.
name: marketing

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "Kurs-Stichwort (Teil von courses.keyword), z. B. MAF."
        type: string
        default: "MAF"

permissions:
  contents: read

concurrency:
  group: marketing
  cancel-in-progress: false

jobs:
  marketing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Werbetexte schreiben, prüfen, ablegen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KEYWORD: ${{ inputs.keyword }}
        run: node scripts/autonomy/marketing.mjs lauf --keyword "$KEYWORD"
