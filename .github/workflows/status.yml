# Loop-Status und Wächter (SIN-238): schreibt den Text des angepinnten Issues „Loop-Status“ neu (Label
# `loop-status`) und kommentiert mit @siinanXD, wenn die Kette still steht oder abbricht (einmal pro Vorfall).
# Auslöser: nach jedem dispatch- und worker-Lauf, stündlich (schedule) und von außen alle 15 Min per
# workflow_dispatch (cron-job.org, siehe docs/autonomy/README.md), weil GitHubs schedule unzuverlässig feuert.
# Steht die Kette still (nichts läuft, aber Startbares da), stößt dieser Lauf dispatch.yml selbst an.
# Secrets: LINEAR_API_KEY. Optional für Kontingente: VERCEL_TOKEN, SUPABASE_ACCESS_TOKEN, SENTRY_AUTH_TOKEN,
# LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY; Variablen VERCEL_PROJECT_ID, VERCEL_TEAM_ID, SUPABASE_PROJECT_REF, SENTRY_ORG.
# Ohne Wert steht in der Tabelle „nicht messbar“. AGENT_WORKFLOW_TOKEN: damit @claude im PR einen Lauf auslöst.
name: status

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur ausgeben, nichts schreiben"
        type: boolean
        default: false
  workflow_run:
    workflows: [dispatch, worker]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Ein Lauf zur Zeit; ein wartender Lauf reicht (der Text wird ohnehin komplett neu gebaut).
    concurrency:
      group: status
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ github.token }}
      AGENT_PAUSED_UNTIL: ${{ vars.AGENT_PAUSED_UNTIL }}
      # Phase (SIN-244): Anzeige und Startfilter
      PHASE: ${{ vars.PHASE }}
      OBSERVE_DAYS: ${{ vars.OBSERVE_DAYS }}
      PHASE_SINCE: ${{ vars.PHASE_SINCE }}
      # Nachfüllen (SIN-262): optional, sonst Standard der Bauphase (6 / 10 / 2 h)
      REFILL_MIN: ${{ vars.REFILL_MIN }}
      REFILL_MAX: ${{ vars.REFILL_MAX }}
      REFILL_COOLDOWN_H: ${{ vars.REFILL_COOLDOWN_H }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      AGENT_WORKFLOW_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Production-Deploy (SIN-266, SIN-309, SIN-332): startet production-deploy.yml (Vercel CLI), höchstens 1× pro Stunde,
      # nur bei neuem App-Code, ein Versuch je Commit. Roter Alarm (nicht lesbar, > 3 h hinter main) geht zusätzlich per Telegram.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF }}
      # Leitstand (SIN-303): Ereignisse und Schnappschuss nach Supabase (vorhandene Secrets, nur schreiben in loop_*)
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Leitstand Start
        if: env.DRY != 'true'
        continue-on-error: true
        run: |
          echo "LEITSTAND_SEIT=$(date +%s%3N)" >> "$GITHUB_ENV"
          node scripts/autonomy/leitstand.mjs ereignis --schritt status --status start
      # Konflikte nur in erzeugten Dateien (Entscheidungs-Index, CHANGELOG) ohne KI lösen (SIN-312).
      # Das Ergebnis liest status.mjs: gelöste PRs bekommen keine @claude-Bitte.
      - name: Konflikte in erzeugten Dateien lösen
        if: env.DRY != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
          KONFLIKT_FILE: ${{ runner.temp }}/konflikt.json
        run: node scripts/autonomy/konflikt.mjs
      - name: Status schreiben und Wächter
        id: status
        env:
          KONFLIKT_FILE: ${{ runner.temp }}/konflikt.json
        run: |
          if [ "$DRY" = "true" ]; then node scripts/autonomy/status.mjs --dry-run
          else node scripts/autonomy/status.mjs; fi
      # Selbstheilung: Stillstand → Dispatcher anstoßen (nicht öfter als alle 10 Min, entscheidet status.mjs).
      - name: Dispatcher anstoßen
        if: steps.status.outputs.kick == 'true' && env.DRY != 'true'
        run: gh workflow run dispatch.yml --repo "$GITHUB_REPOSITORY" --ref main -f dry_run=false
        env:
          GH_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
      # Schlange nachfüllen (SIN-253): unter 5 startbaren Todos, höchstens alle 6 h (Merker im Status-Issue).
      - name: Planer anstoßen
        if: steps.status.outputs.refill == 'true' && env.DRY != 'true'
        run: gh workflow run planner.yml --repo "$GITHUB_REPOSITORY" --ref main -f dry_run=false -f max_issues="${{ steps.status.outputs.refill_max }}" -f bugs_only="${{ steps.status.outputs.refill_bugs_only }}"
        env:
          GH_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
      - name: Leitstand Ende
        if: always() && env.DRY != 'true'
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          status=$([ "$JOB_STATUS" = "success" ] && echo ok || echo fehler)
          node scripts/autonomy/leitstand.mjs ereignis --schritt status --status "$status" --seit "$LEITSTAND_SEIT"
