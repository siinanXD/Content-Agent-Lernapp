# Vorlage (SIN-227) → nach .github/workflows/planner.yml kopieren (der Agent-Token darf dort nicht schreiben).
# Planer: sonntags Definition fertig und Produktreife (PRODUCT.md), offene Linear-Issues und Kennzahlen lesen,
# Claude schreibt plan.json (drei Spuren, je höchstens 3 Issues, dazu höchstens 1 Design-Paket), das Skript legt
# die Issues als Todo an und die Produktreife-Tabelle in den Bericht. Ist alles grün: Abnahme-Issue für Sinan
# und Pflege-Modus (nur Fehler + Content). Ersetzt den Frontend-Agent.
# Secrets: LINEAR_API_KEY, CLAUDE_CODE_OAUTH_TOKEN; optional SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# SENTRY_AUTH_TOKEN/SENTRY_ORG/SENTRY_PROJECT, POSTHOG_PERSONAL_API_KEY/POSTHOG_PROJECT_ID,
# FIGMA_ACCESS_TOKEN (nur lesen; fehlt er, steht „nicht verfügbar“ im Bericht).
name: planner

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur anzeigen, nichts in Linear anlegen"
        type: boolean
        default: false
      max_issues:
        description: "Nachfüllen (SIN-253): höchstens so viele neue Issues; leer = Wochenplan-Regeln"
        type: string
        default: ""
      bugs_only:
        description: "Nachfüllen (SIN-253): nur Bugs (Claude-Kontingent knapp oder API-Deckel fast erreicht, SIN-266)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# Nie zwei Planer-Läufe gleichzeitig.
concurrency:
  group: planner
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
      POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
      FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      PLAN_MAX_ISSUES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_issues || '' }}
      PLAN_BUGS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.bugs_only }}
      AGENT_PAUSED_UNTIL: ${{ vars.AGENT_PAUSED_UNTIL }}
      # Phase (SIN-244): bauen | betrieb, Beobachtungsfenster in Tagen, Beginn des Betriebs (ISO-Datum)
      PHASE: ${{ vars.PHASE }}
      OBSERVE_DAYS: ${{ vars.OBSERVE_DAYS }}
      PHASE_SINCE: ${{ vars.PHASE_SINCE }}
      # Free-Tier-Wächter (SIN-225): Läufe und PRs lesen mit dem Agenten-Token (Actions-Recht), ohne neue permissions.
      GITHUB_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Leitstand (SIN-303): Start/Ende als Ereignis in Supabase (nie ein Fehlerabbruch).
      - name: Leitstand Start
        if: env.DRY != 'true'
        continue-on-error: true
        run: |
          echo "LEITSTAND_SEIT=$(date +%s%3N)" >> "$GITHUB_ENV"
          node scripts/autonomy/leitstand.mjs ereignis --schritt planner --status start
      - name: Pause prüfen (Claude-Limit)
        id: pause
        run: node scripts/autonomy/dispatch.mjs --check-pause
      # Linear nicht erreichbar (SIN-263): Ausgabe linear_ok=false, die Folgeschritte entfallen, der Lauf bleibt grün.
      - name: Kontext sammeln (inkl. Produktreife-Tabelle)
        id: ctx
        if: steps.pause.outputs.paused != 'true'
        run: node scripts/autonomy/planner.mjs --context --out /tmp/planner-prompt.md
      - name: Claude schreibt den Plan
        if: steps.pause.outputs.paused != 'true' && steps.ctx.outputs.linear_ok != 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Lies /tmp/planner-prompt.md und folge der Anweisung dort. Schreibe plan.json im Repo-Wurzelverzeichnis."
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 15
            --allowedTools "Read,Write,Glob,Grep"
      - name: Issues anlegen (je Spur max. 3, 1 Design-Paket)
        if: steps.pause.outputs.paused != 'true' && steps.ctx.outputs.linear_ok != 'false'
        run: |
          if [ "$DRY" = "true" ]; then node scripts/autonomy/planner.mjs --create plan.json --dry-run | tee -a "$GITHUB_STEP_SUMMARY"
          else node scripts/autonomy/planner.mjs --create plan.json | tee -a "$GITHUB_STEP_SUMMARY"; fi
      - name: Leitstand Ende
        if: always() && env.DRY != 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          status=$([ "$JOB_STATUS" = "success" ] && echo ok || echo fehler)
          node scripts/autonomy/leitstand.mjs ereignis --schritt planner --status "$status" --seit "$LEITSTAND_SEIT"
