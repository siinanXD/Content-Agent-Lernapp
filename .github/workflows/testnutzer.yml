# Testnutzer-Agent (SIN-640): spielt die Live-App wie ein Azubi durch und meldet, was hakt.
# Crawler (job `crawler`, ohne KI, nachts): alle Routen auf Handy und Desktop, Funde werden Korrektur-Issues (Label frontend/content,
# Dubletten-Prüfung, höchstens 5 neue je Lauf), Bericht als Kommentar in SIN-640.
# Personas (job `personas`, montags, Claude Haiku bewertet Bilder, Deckel 0,50 USD): drei feste Wege, gleiche Meldung.
# Nur lesend: schreibende Anfragen an /api sind abgefangen, keine Konten, keine echten Nutzerdaten. Skripte: scripts/autonomy/{crawler,personas,testnutzer}.mjs
# Secrets: LINEAR_API_KEY; Personas zusätzlich ANTHROPIC_API_KEY (ohne: übersprungen, Hinweis im Lauf).
name: testnutzer

on:
  schedule:
    - cron: "40 21 * * *"
    - cron: "10 20 * * 1"
  workflow_dispatch:
    inputs:
      ebene:
        description: "Was laufen soll"
        type: choice
        options: [crawler, personas]
        default: crawler
      url:
        description: "Adresse der App (leer = Production)"
        type: string
        default: ""
      dry_run:
        description: "Nur ausgeben, keine Issues und kein Kommentar"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testnutzer-${{ github.event.schedule || inputs.ebene }}
  cancel-in-progress: false

env:
  LIVE_URL: ${{ inputs.url || 'https://content-agent-ashen-nu.vercel.app' }}
  LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
  DRY: ${{ inputs.dry_run && '--dry-run' || '' }}

jobs:
  crawler:
    if: github.event.schedule == '40 21 * * *' || inputs.ebene == 'crawler'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Alle Seiten abgehen
        run: node scripts/autonomy/crawler.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: testnutzer
          path: testnutzer-ergebnis/
          if-no-files-found: warn
          retention-days: 14
      - name: Issues und Bericht
        run: node scripts/autonomy/testnutzer.mjs melden --quelle crawler --lauf "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" $DRY

  personas:
    if: github.event.schedule == '10 20 * * 1' || inputs.ebene == 'personas'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Drei Wege spielen
        run: node scripts/autonomy/personas.mjs
      - name: Bewerten
        run: node scripts/autonomy/testnutzer.mjs bewerten
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: testnutzer
          path: testnutzer-ergebnis/
          if-no-files-found: warn
          retention-days: 14
      - name: Issues und Bericht
        run: |
          [ -f testnutzer-ergebnis/funde-personas.json ] || { echo "Keine Bewertung: nichts zu melden."; exit 0; }
          node scripts/autonomy/testnutzer.mjs melden --quelle personas --lauf "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" $DRY
