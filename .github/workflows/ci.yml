# Required PR build gate — lint, typecheck, unit tests, production build,
# Playwright smoke + axe-core against `next start` (SIN-207).
# Node 22 matches `.github/workflows/source-check.yml` (no `.nvmrc` / `engines.node` on main yet).
#
# SIN-1119: Die Prüfungen laufen parallel statt hintereinander (PR-Lauf von ca. 8 auf ca. 4 Minuten).
#   pruefen  Entscheidungs-Index, check:fast (Lint, Typecheck, Unit-Tests), README-Erinnerung
#   bauen    Production build, legt `.next` als Artefakt ab
#   e2e      Playwright-Smoke + axe-core gegen das Build-Artefakt
#   perf     Leistungsbudget (Lighthouse), in 2 Teile nach Route geteilt, gegen das Build-Artefakt
#   build    Sammeljob: einziger Pflicht-Check für Branch-Protection (Name unverändert), rot, sobald einer
#            der Jobs oben nicht grün ist. Die Schrittnamen bleiben, weil pr-gate (Steckbrief) und
#            revert-guard sie lesen.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Startet post-merge.yml nach einem Auto-Merge (SIN-213).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # SIN-251: Der Index liegt im selben PR. Fehlt er oder ist er veraltet, schlägt der Check fehl.
      - name: Entscheidungs-Index aktuell
        run: node scripts/decisions-index.mjs --check || { echo "::error::docs/DECISIONS.md ist veraltet. Lokal 'npm run decisions:index' ausführen und die Datei im selben PR committen."; exit 1; }

      - name: Lint, Typecheck, Unit-Tests ohne Keys (check:fast, SIN-875)
        run: npm run check:fast

      # SIN-300: Erinnerung, kein Fehler: README.md im selben PR anpassen, wenn Funktion, Einrichtung, Befehle oder Umgebungsvariablen sich ändern.
      - name: README-Erinnerung
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # HEAD ist der Merge-Commit des PRs in die Basis: der Unterschied zur Basis sind genau die Änderungen des PRs.
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          node scripts/readme-check.mjs --base "origin/$BASE_REF"

  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
        env:
          COURSE_STORAGE: mock

      # Ein Tar statt eines Ordners: `.next` ist ein versteckter Ordner, den upload-artifact sonst auslässt.
      # `.next/cache` ist nur Build-Zwischenspeicher und wird für `next start` nicht gebraucht.
      - name: Build-Artefakt packen
        run: tar -czf next-build.tgz --exclude=.next/cache .next

      - name: Build-Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: next-build.tgz
          compression-level: 0
          retention-days: 1

  # SIN-207: Die App startet sich selbst und wird im Browser geprüft.
  # Smoke (Seiten rendern, /api/health) + axe-core (WCAG 2.1 AA) gegen `next start`.
  e2e:
    needs: bauen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build-Artefakt laden
        uses: actions/download-artifact@v8
        with:
          name: next-build

      - name: Build-Artefakt entpacken
        run: tar -xzf next-build.tgz

      # SIN-298: Browser-Download zwischenspeichern, Systempakete kommen immer neu.
      - name: Playwright-Cache
        id: pw
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        env:
          CACHE_HIT: ${{ steps.pw.outputs.cache-hit }}
        run: if [ "$CACHE_HIT" = "true" ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi

      - name: Smoke + accessibility (Playwright)
        run: npx playwright test
        env:
          COURSE_STORAGE: mock

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # SIN-300: feste Grenzen je Route (performance-budget.json: LCP, CLS, TBT, JS-Größe). Überschreitung = rot = kein Merge.
  # Die Routen laufen in 2 Teilen auf getrennten Runnern, die Grenzen sind für alle Routen gleich geblieben.
  perf:
    name: perf (${{ matrix.shard }})
    needs: bauen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build-Artefakt laden
        uses: actions/download-artifact@v8
        with:
          name: next-build

      - name: Build-Artefakt entpacken
        run: tar -xzf next-build.tgz

      - name: Playwright-Cache
        id: pw
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Lighthouse nutzt das Chromium von Playwright (scripts/performance-budget.mjs).
      - name: Install Playwright Chromium
        env:
          CACHE_HIT: ${{ steps.pw.outputs.cache-hit }}
        run: if [ "$CACHE_HIT" = "true" ]; then npx playwright install-deps chromium; else npx playwright install --with-deps chromium; fi

      - name: Leistungsbudget (Lighthouse)
        run: npm run perf:budget -- --serve --shard "$SHARD"
        env:
          COURSE_STORAGE: mock
          SHARD: ${{ matrix.shard }}

  # Pflicht-Check `build` (Branch-Protection, pr-gate, review, status lesen diesen Namen). Läuft auch nach roten
  # Vorgängern und ist nur grün, wenn alle vier Jobs grün sind; übersprungen (z. B. weil `bauen` rot war) zählt als rot.
  build:
    needs: [pruefen, bauen, e2e, perf]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRUEFEN: ${{ needs.pruefen.result }}
      BAUEN: ${{ needs.bauen.result }}
      E2E: ${{ needs.e2e.result }}
      PERF: ${{ needs.perf.result }}
    steps:
      - name: Unit tests, Lint, Typecheck (Job pruefen)
        run: test "$PRUEFEN" = success || { echo "::error::Job pruefen ist $PRUEFEN (Entscheidungs-Index, Lint, Typecheck oder Unit-Tests). Details im Job pruefen."; exit 1; }

      - name: Production build (Job bauen)
        if: ${{ !cancelled() }}
        run: test "$BAUEN" = success || { echo "::error::Job bauen ist $BAUEN (Production build). Details im Job bauen."; exit 1; }

      - name: Smoke + accessibility (Playwright) (Job e2e)
        if: ${{ !cancelled() }}
        run: test "$E2E" = success || { echo "::error::Job e2e ist $E2E (Playwright-Smoke oder axe-core). Details im Job e2e."; exit 1; }

      - name: Leistungsbudget (Lighthouse) (Job perf)
        if: ${{ !cancelled() }}
        run: test "$PERF" = success || { echo "::error::Job perf ist $PERF (Leistungsbudget). Details in den Jobs perf (1/2) und perf (2/2)."; exit 1; }
