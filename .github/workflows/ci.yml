# Required PR build gate — lint, typecheck, unit tests, production build,
# Playwright smoke + axe-core against `next start` (SIN-207).
# Node 22 matches `.github/workflows/source-check.yml` (no `.nvmrc` / `engines.node` on main yet).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Startet post-merge.yml nach einem Auto-Merge (SIN-213).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # SIN-251: Der Index liegt im selben PR. Fehlt er oder ist er veraltet, schlägt der Check fehl.
      - name: Entscheidungs-Index aktuell
        run: node scripts/decisions-index.mjs --check || { echo "::error::docs/DECISIONS.md ist veraltet. Lokal 'npm run decisions:index' ausführen und die Datei im selben PR committen."; exit 1; }

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          COURSE_STORAGE: mock

      # SIN-207: Die App startet sich selbst und wird im Browser geprüft.
      # Smoke (Seiten rendern, /api/health) + axe-core (WCAG 2.1 AA) gegen `next start`.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke + accessibility (Playwright)
        run: npx playwright test
        env:
          COURSE_STORAGE: mock

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
