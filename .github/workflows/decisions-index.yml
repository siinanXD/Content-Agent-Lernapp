# Index der Entscheidungen (SIN-240): docs/DECISIONS.md wird aus docs/decisions/*.md erzeugt.
# Kein Agent-PR bearbeitet den Index, darum konfligieren parallele PRs nicht. Nach jedem Merge, der eine
# Entscheidungsdatei ändert, baut dieser Lauf den Index neu und öffnet (oder aktualisiert) genau einen PR;
# der Auto-Merge (risk:medium) mergt ihn. Der Index-PR ändert nur docs/DECISIONS.md und löst sich selbst nicht erneut aus.
# Läuft mit AGENT_WORKFLOW_TOKEN, sonst starten die Checks des PRs nicht.
name: decisions-index

on:
  push:
    branches: [main]
    paths:
      - "docs/decisions/**"
      - "scripts/decisions-index.mjs"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: decisions-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
    steps:
      - name: Agenten-Token prüfen
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret AGENT_WORKFLOW_TOKEN fehlt: Aktionen mit github.token lösen keine Folge-Workflows aus."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.AGENT_WORKFLOW_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Index neu bauen
        run: node scripts/decisions-index.mjs
      - name: Per PR einreichen
        run: |
          if git diff --quiet -- docs/DECISIONS.md; then echo "Index ist aktuell."; exit 0; fi
          branch="chore/decisions-index"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add docs/DECISIONS.md
          git commit -m "docs(decisions): Index aktualisieren (SIN-240)"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head "$branch" --base main \
              --title "docs(decisions): Index aktualisieren (SIN-240)" \
              --body "Part of SIN-240. Erzeugt von scripts/decisions-index.mjs, nicht von Hand bearbeiten."
          fi
