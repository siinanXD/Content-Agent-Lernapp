# Dispatcher: alle 30 Min wählt er bis zu 2 Linear-Issues (Todo, keine offenen Blocker, kein Label design/abnahme/
# needs-human, Spuren frontend/content/backend abwechselnd) und startet je Issue einen eigenen Lauf von worker.yml.
# Er hält keine Claude-Sitzung fest: die Gruppe `dispatch` ist nach Sekunden frei, die Worker laufen parallel,
# je Issue in einer eigenen Gruppe. Cursor zuerst: Claude übernimmt nur Issues mit Label `claude` oder solche,
# die seit 1 h unberührt in Todo liegen und zu denen kein offener PR gehört. Max. 2 Issues parallel.
# Budget: Ist AGENT_PAUSED_UNTIL (Repo-Variable) in der Zukunft, startet nichts (Pause setzt der Worker, nur bei echtem Limit).
# Secrets: LINEAR_API_KEY. Dry-Run: Eingabe `dry_run` = true (Standard ist false).
name: dispatch

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur anzeigen, nichts starten"
        type: boolean
        default: false
  # Nach Merge: Linear auf Done. Blocker nach 3 Runden: Kommentar in Linear.
  pull_request:
    types: [closed, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: write

jobs:
  dispatch:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nie zwei Wahl-Läufe gleichzeitig (sonst starten beide dasselbe Issue). Der Lauf dauert nur Sekunden.
    concurrency:
      group: dispatch
      cancel-in-progress: false
    env:
      AGENT_PAUSED_UNTIL: ${{ vars.AGENT_PAUSED_UNTIL }}
      GITHUB_TOKEN: ${{ github.token }}
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.AGENT_WORKFLOW_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Issues wählen (max. 2, Spuren abwechselnd)
        id: pick
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          if [ "$DRY" = "true" ]; then node scripts/autonomy/dispatch.mjs --dry-run
          else node scripts/autonomy/dispatch.mjs; fi
      # Je Issue ein eigener Worker-Lauf (eigene concurrency-Gruppe je Issue in worker.yml).
      - name: Worker starten
        if: steps.pick.outputs.found == 'true' && env.DRY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IDENTIFIERS: ${{ steps.pick.outputs.identifiers }}
        run: |
          for id in $IDENTIFIERS; do
            gh workflow run worker.yml --repo "$GITHUB_REPOSITORY" --ref main -f identifier="$id"
          done

  linear-done:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Eigene Gruppe je PR: darf nie hinter einem langen Dispatcher-Lauf warten oder verworfen werden.
    concurrency:
      group: dispatch-done-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Linear auf Done
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          id=$(printf '%s' "$TITLE" | grep -Eo 'SIN-[0-9]+' | tail -1)
          [ -n "$id" ] && node scripts/autonomy/dispatch.mjs --done "$id" || echo "Keine Linear-ID im Titel."

  linear-blocker:
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'needs-human' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dispatch-blocker-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Blocker-Kommentar in Linear
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
        run: |
          id=$(printf '%s' "$TITLE" | grep -Eo 'SIN-[0-9]+' | tail -1)
          [ -n "$id" ] && node scripts/autonomy/dispatch.mjs --blocker "$id" "$URL" || echo "Keine Linear-ID im Titel."
